[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "indic-product-photo-studio"
version = "0.1.0"
description = "AI product photo tool for Indic marketplace sellers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python-headless",
    "numpy",
    "pillow",
    "pillow-heif",
    "rembg[cpu]",
    "gradio",
    "pytest",
    "requests",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
markers = [
    "slow: marks tests as slow",
]

